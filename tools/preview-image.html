<!doctype html>
<!--
  The picture shown when the link to the site is shared (public/preview.png, 1200 × 630).
  It is not part of the site: it is only the drawing the picture is taken from.

  The two lines of text (name and role, then the headline) are copied from `profile`
  in src/data/journey.ts. If they change there, change them here too and take the picture again:
  open this file in Chrome at 1200 × 630 and save a screenshot as public/preview.png.
-->
<html lang="en">

      html,

        margin: 0;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #1b1f4b;
      }
      .card svg {
        position: absolute;
        inset: 0;
      }
      .who,
      .headline {
        position: absolute;
        left: 64px;
        margin: 0;
      }
      .who {
        top: 50px;
        font: 700 36px/1.3 'Atkinson Next', sans-serif;
      }
      .headline {
        top: 112px;
        width: 820px;
        font: 900 72px/1.02 Fraunces, serif;

        letter-spacing: -0.012em;

    </style>
  </head>
